name: Status Room global trend image radar

on:
  pull_request:
    paths:
      - "trend_radar.py"
      - "tests/**"
      - ".github/workflows/trend-radar.yml"
      - "README_FA.md"
  workflow_dispatch:
    inputs:
      publish:
        description: "انتشار واقعی در تلگرام؛ حالت پیش‌فرض فقط dry-run است"
        required: false
        type: boolean
        default: false
  schedule:
    # Daily at 14:00 Tehran (10:30 UTC); GitHub starts are best-effort.
    - cron: "30 10 * * *"

permissions:
  contents: read

concurrency:
  group: status-room-trend-radar
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile trend radar
        run: python -m py_compile trend_radar.py
      - name: Run offline safety and attribution tests
        run: python -m unittest discover -s tests -p "test_trend_radar.py" -v

  dry-run:
    # Scheduled runs are deliberately dry-run only until live candidates,
    # image relevance and license attribution have been verified end-to-end.
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.publish != true)
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Collect real candidates without sending to Telegram
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.1-flash-lite
          TREND_DRY_RUN: "1"
          TREND_STATE_FILE: /tmp/status-room-trend-dry-run-state.json
        run: python trend_radar.py --dry-run

  publish:
    # Real publishing requires an intentional manual opt-in; schedule never publishes.
    if: github.event_name == 'workflow_dispatch' && inputs.publish == true
    needs: validate
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Publish only licensed and validated image cards
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.1-flash-lite
          TREND_DRY_RUN: "0"
        run: python trend_radar.py --publish
      - name: Persist image duplicate-prevention state
        run: |
          git config user.name "status-room-bot"
          git config user.email "actions@users.noreply.github.com"
          git add trend_state.json
          git diff --cached --quiet || git commit -m "Update licensed trend image state"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push; then
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying after syncing with origin."
            sleep 2
          done
          echo "Could not persist trend image state after 3 attempts."
          exit 1

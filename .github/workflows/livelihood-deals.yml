name: Status Room livelihood and deals
on:
  push:
    paths:
      - 'livelihood_digest.py'
  workflow_dispatch:
  schedule:
    # 08:00, 14:00 and 20:00 Asia/Tehran (UTC+3:30).
    - cron: "30 4,10,16 * * *"
permissions:
  contents: write
concurrency:
  group: status-room-livelihood-deals
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Publish livelihood and official discount updates
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.1-flash-lite
        run: python livelihood_digest.py
      - name: Persist duplicate-prevention state
        run: |
          git config user.name "status-room-bot"
          git config user.email "actions@users.noreply.github.com"
          git add livelihood_state.json
          git diff --cached --quiet || git commit -m "Update livelihood and deals state"
          git pull --rebase origin main
          git push

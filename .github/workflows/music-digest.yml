name: Status Room licensed music

on:
  workflow_dispatch:
  schedule:
    # Morning music 06:15 Tehran; night music 20:15 Tehran.
    - cron: "45 2 * * *"
    - cron: "45 16 * * *"

permissions:
  contents: write

concurrency:
  group: status-room-music
  cancel-in-progress: false

jobs:
  music:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install requests
        run: pip install requests==2.32.3
      - name: Validate music publisher
        run: python -m py_compile music_digest.py
      - name: Publish a licensed music recommendation
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATUS_ROOM_CHANNEL_URL: ${{ secrets.STATUS_ROOM_CHANNEL_URL }}
        run: python music_digest.py
      - name: Persist music duplicate-prevention state
        run: |
          git config user.name "status-room-bot"
          git config user.email "actions@users.noreply.github.com"
          git add music_state.json
          git diff --cached --quiet || git commit -m "Update licensed music state"
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}"
            if git push origin "${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying after syncing with origin."
            sleep 2
          done
          echo "Could not persist music state after 3 attempts."
          exit 1

name: Validate technology and sports desks
on:
  pull_request:
    paths:
      - "tech_digest.py"
      - "sports_results.py"
      - ".github/workflows/tech-digest.yml"
      - ".github/workflows/sports-results.yml"
      - "requirements.txt"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile new publishers
        run: python -m py_compile tech_digest.py sports_results.py

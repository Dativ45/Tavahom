name: Shared desk core tests
on:
  push:
    branches: [main, "feature/**"]
    paths: ["desk_core.py", "tech_digest_v2.py", "tests/test_desk_core.py", ".github/workflows/desk-core-tests.yml", ".github/workflows/tech-v2-manual-dry-run.yml", "requirements.txt"]
  pull_request:
    paths: ["desk_core.py", "tech_digest_v2.py", "tests/test_desk_core.py", ".github/workflows/desk-core-tests.yml", ".github/workflows/tech-v2-manual-dry-run.yml", "requirements.txt"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m py_compile desk_core.py tech_digest_v2.py
      - run: python -m unittest discover -s tests -v

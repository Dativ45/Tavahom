name: Status Room daily morning briefing

on:
  workflow_dispatch:
  schedule:
    # 06:00 Asia/Tehran (UTC+3:30).
    - cron: "30 2 * * *"

permissions:
  contents: read

concurrency:
  group: status-room-morning-briefing
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate morning publisher
        run: python -m py_compile daily_briefing.py
      - name: Publish daily briefing
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.1-flash-lite
          STATUS_ROOM_CHANNEL_URL: ${{ secrets.STATUS_ROOM_CHANNEL_URL }}
        run: python daily_briefing.py

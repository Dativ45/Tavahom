name: Status Room live news publisher

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Safe preview only; do not post to Telegram"
        required: true
        type: boolean
        default: true
  schedule:
    # Best-effort GitHub polling; scheduled starts can be delayed by GitHub.
    - cron: "2-59/5 * * * *"

permissions:
  contents: write

concurrency:
  group: status-room-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate Python syntax for all publishers
        run: python -m py_compile bot.py daily_posts.py market_digest.py iran_sports.py livelihood_digest.py
      - name: Publish one bilingual sourced story
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.1-flash-lite
          STATUS_ROOM_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: python bot.py
      - name: Persist duplicate-prevention state
        run: |
          git config user.name "status-room-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "Update published story state"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push; then
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying after syncing with origin."
            sleep 2
          done
          echo "Could not persist state after 3 attempts."
          exit 1

name: Status Room entertainment and culture desk
on:
  workflow_dispatch:
  schedule:
    - cron: "30 10,17 * * *"
permissions:
  contents: write
concurrency:
  group: status-room-entertainment-desk
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate syntax
        run: python -m py_compile entertainment_digest.py
      - name: Publish one selected culture story
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.1-flash-lite
          STATUS_ROOM_CHANNEL_URL: ${{ secrets.STATUS_ROOM_CHANNEL_URL }}
        run: python entertainment_digest.py
      - name: Persist duplicate-prevention state
        run: |
          git config user.name "status-room-bot"
          git config user.email "actions@users.noreply.github.com"
          git add entertainment_state.json
          git diff --cached --quiet || git commit -m "Update entertainment desk state"
          git pull --rebase origin ${{ github.ref_name }}
          git push

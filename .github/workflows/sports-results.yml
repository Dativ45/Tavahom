name: Status Room global sports results
on:
  workflow_dispatch:
  schedule:
    - cron: "7,37 * * * *"
permissions:
  contents: write
concurrency:
  group: status-room-sports-results
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate syntax
        run: python -m py_compile sports_results.py
      - name: Publish completed global match results
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATUS_ROOM_CHANNEL_URL: ${{ secrets.STATUS_ROOM_CHANNEL_URL }}
        run: python sports_results.py
      - name: Persist duplicate-prevention state
        run: |
          git config user.name "status-room-bot"
          git config user.email "actions@users.noreply.github.com"
          git add sports_results_state.json
          git diff --cached --quiet || git commit -m "Update sports results state"
          git pull --rebase origin ${{ github.ref_name }}
          git push

name: Validate news publishers

on:
  push:
    branches: [main]
    paths:
      - "bot.py"
      - "influencer_posts.py"
      - "daily_posts.py"
      - "daily_briefing.py"
      - "trend_radar.py"
      - "livelihood_digest.py"
      - "market_digest.py"
      - "sports_results.py"
      - "iran_sports.py"
      - ".github/workflows/validate-news-publishers.yml"
      - "requirements.txt"
      - "tests/**"
  pull_request:
    paths:
      - "bot.py"
      - "influencer_posts.py"
      - "daily_posts.py"
      - "daily_briefing.py"
      - "trend_radar.py"
      - "livelihood_digest.py"
      - "market_digest.py"
      - "sports_results.py"
      - "iran_sports.py"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile news publishers
        run: python -m py_compile bot.py influencer_posts.py daily_posts.py daily_briefing.py trend_radar.py livelihood_digest.py market_digest.py sports_results.py iran_sports.py
      - name: Run publisher regression tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Smoke-test editorial scoring
        run: |
          python - <<'PY'
          import influencer_posts
          samples = [
              {"text": "The government announced new sanctions and a ceasefire proposal after the attack, with measures to protect civilians and regional stability."},
              {"text": "Good morning everyone, have a wonderful weekend!"},
          ]
          assert influencer_posts.editorial_score(samples[0]) >= 2
          assert influencer_posts.editorial_score(samples[1]) < 2
          print("Editorial scoring smoke test passed.")
          PY

      - name: Check Reuters and AP feed availability
        run: |
          python - <<'PY'
          import feedparser
          feeds = {
              "Reuters via Google News": "https://news.google.com/rss/search?q=when:24h+site:reuters.com&ceid=US:en&hl=en-US&gl=US",
              "AP via Google News": "https://news.google.com/rss/search?q=when:24h+site:apnews.com&ceid=US:en&hl=en-US&gl=US",
          }
          for name, url in feeds.items():
              parsed = feedparser.parse(url)
              count = len(parsed.entries)
              print(f"{name}: {count} entries; bozo={getattr(parsed, 'bozo', False)}")
              if count == 0:
                  raise SystemExit(f"Feed returned no entries: {name}")
          PY

      - name: Verify public link previews are enabled
        run: |
          python - <<'PY'
          from pathlib import Path
          publishers = [
              "bot.py", "daily_posts.py", "daily_briefing.py", "trend_radar.py",
              "livelihood_digest.py", "market_digest.py", "sports_results.py",
              "iran_sports.py", "influencer_posts.py",
          ]
          for name in publishers:
              source = Path(name).read_text(encoding="utf-8")
              if '"disable_web_page_preview": True' in source or "'disable_web_page_preview': True" in source:
                  if name == "bot.py":
                      # The pinned internal archive intentionally has no preview.
                      publisher = source.split("def publish(message):", 1)[1].split("def archive_category_for_desk", 1)[0]
                      if '"disable_web_page_preview": True' in publisher:
                          raise SystemExit(f"Link preview is disabled in publisher: {name}")
                  else:
                      raise SystemExit(f"Link preview is disabled in publisher: {name}")
              print(f"{name}: public post previews enabled")
          PY

name: Status Room global technology desk
on:
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"
permissions:
  contents: write
concurrency:
  group: status-room-tech-desk
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate syntax
        run: python -m py_compile tech_digest.py
      - name: Publish global technology story with source image when available
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.1-flash-lite
          STATUS_ROOM_CHANNEL_URL: ${{ secrets.STATUS_ROOM_CHANNEL_URL }}
        run: python tech_digest.py
      - name: Persist duplicate-prevention state
        run: |
          git config user.name "status-room-bot"
          git config user.email "actions@users.noreply.github.com"
          git add tech_state.json
          git diff --cached --quiet || git commit -m "Update global technology news state"
          git pull --rebase origin ${{ github.ref_name }}
          git push

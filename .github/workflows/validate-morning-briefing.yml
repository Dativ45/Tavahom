name: Validate daily morning briefing

on:
  push:
    branches: ["**"]
    paths:
      - "daily_briefing.py"
      - ".github/workflows/daily-briefing.yml"
      - ".github/workflows/validate-morning-briefing.yml"
  pull_request:
    paths:
      - "daily_briefing.py"
      - ".github/workflows/daily-briefing.yml"
      - ".github/workflows/validate-morning-briefing.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile morning publisher
        run: python -m py_compile daily_briefing.py
